{% extends "base.html" %}

{% block title %}{{ trans('Log in') }}{% endblock %}

{% block content %}
    <div class="login-page">
        <form class="login-page__panel cv-card" method="post" action="{{ url_for('main.login') }}" autocomplete="on">
            <input type="hidden" name="next" value="{{ next_url }}">
            <div class="login-page__badge" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CVCounter">
                    <g stroke="#4dabf7" stroke-width="28" stroke-linecap="round" fill="none">
                        <path d="M102 102 H186 M102 102 V186"/>
                        <path d="M410 102 H326 M410 102 V186"/>
                        <path d="M102 410 H186 M102 410 V326"/>
                        <path d="M410 410 H326 M410 410 V326"/>
                    </g>
                    <circle cx="256" cy="256" r="78" fill="none" stroke="#4dabf7" stroke-width="28"/>
                    <circle cx="256" cy="256" r="30" fill="#4dabf7"/>
                    <circle cx="256" cy="256" r="12" fill="rgba(255,255,255,0.9)"/>
                </svg>
            </div>
            <h1 class="login-page__title">{{ trans('Log in') }}</h1>
            <p class="login-page__hint text-body-secondary">{{ trans('Sign in with an account.') }}</p>

            {% if error %}
                <div class="login-page__error" role="alert">{{ error }}</div>
            {% endif %}

            <div class="mb-3 text-start">
                <label class="form-label" for="login-username">{{ trans('Username') }}</label>
                <input class="form-control" type="text" id="login-username" name="username"
                       value="{{ username }}" required autofocus autocomplete="username">
            </div>
            <div class="mb-3 text-start">
                <label class="form-label" for="login-password">{{ trans('Password') }}</label>
                <input class="form-control" type="password" id="login-password" name="password"
                       required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-100">{{ trans('Log in') }}</button>
            <a class="btn btn-link w-100 mt-2" href="{{ url_for('main.index') }}">{{ trans('Back to homepage') }}</a>
        </form>
    </div>
{% endblock %}
